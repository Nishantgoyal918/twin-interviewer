[project]
name = "twin-interviewer"
version = "0.1.0"
description = "AI interviewer that collects content and style data for a digital twin"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "httpx>=0.27",
  "openai>=1.99",
  "upstash-redis>=1.1",
  "qstash>=2.0",
]

[dependency-groups]
dev = [
  "pgserver>=0.1.4",
  "pytest>=8.3",
  "ruff>=0.6",
  "uvicorn>=0.30",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
